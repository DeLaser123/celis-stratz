[workspace]
resolver = "2"
members = [
    "crates/bt-core",
    "crates/bt-data",
    "crates/bt-strategy",
    "crates/bt-execution",
    "crates/bt-accounting",
    "crates/bt-risk",
    "crates/bt-analytics",
    "crates/bt-simulation",
    "crates/bt-harness",
    "crates/bt-ai",
    "crates/bt-cli",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bt-core = { path = "crates/bt-core" }
bt-data = { path = "crates/bt-data" }
bt-strategy = { path = "crates/bt-strategy" }
bt-execution = { path = "crates/bt-execution" }
bt-accounting = { path = "crates/bt-accounting" }
bt-risk = { path = "crates/bt-risk" }
bt-analytics = { path = "crates/bt-analytics" }
bt-simulation = { path = "crates/bt-simulation" }
bt-harness = { path = "crates/bt-harness" }
bt-ai = { path = "crates/bt-ai" }

rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
csv = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
tracing = "0.1"
rayon = "1"
ureq = "2"
toml = "0.8"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
proptest = "1"

[profile.release]
debug = false
lto = "thin"
