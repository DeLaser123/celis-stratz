strategy:
  name: eurusd_trend_rider
  symbols: [EURUSD]
  entry:
    direction: long
    when:
      all:
        - cross_above: [{field: close}, {sma: {source: {field: close}, period: 20}}]
        - gt: [{rsi: {source: {field: close}, period: 14}}, 50]
  exit:
    when:
      any:
        - cross_below: [{field: close}, {sma: {source: {field: close}, period: 20}}]
  orders:
    entry: {type: market}
    stop_loss: {type: atr_multiple, period: 10, multiple: 2.0}
    take_profit: {type: none}
  risk:
    sizing: {mode: percent_risk, value: 1.0}
